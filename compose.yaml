name: volunteer-crm-${APP_ENV}

services:
  database:
    build:
      context: ./database
    environment:
      APP_ENV: ${APP_ENV}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: ./app
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT},http://127.0.0.1:${FRONTEND_PORT},http://0.0.0.0:${FRONTEND_PORT}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      OIDC_GOOGLE_METADATA_URL: ${OIDC_GOOGLE_METADATA_URL}
      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET}
      OIDC_MICROSOFT_METADATA_URL: ${OIDC_MICROSOFT_METADATA_URL}
      OIDC_MICROSOFT_CLIENT_ID: ${OIDC_MICROSOFT_CLIENT_ID}
      OIDC_MICROSOFT_CLIENT_SECRET: ${OIDC_MICROSOFT_CLIENT_SECRET}
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./app:/app
      - ./database:/database
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  fake-oidc:
    build:
      context: ./fake_oidc
    environment:
      FAKE_OIDC_ISSUER: ${FAKE_OIDC_ISSUER}
      FAKE_OIDC_BROWSER_BASE_URL: ${FAKE_OIDC_BROWSER_BASE_URL}
      FAKE_OIDC_INTERNAL_BASE_URL: http://fake-oidc:9000
      FAKE_OIDC_CLIENT_ID: ${FAKE_OIDC_CLIENT_ID}
      FAKE_OIDC_CLIENT_SECRET: ${FAKE_OIDC_CLIENT_SECRET}
    ports:
      - "${FAKE_OIDC_PORT}:9000"
    volumes:
      - ./database/seed/contacts.csv:/seed/contacts.csv:ro
    profiles: ["development", "test"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ./web
    environment:
      APP_ENV: ${APP_ENV}
      VITE_API_URL: ${FRONTEND_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./web:/web
      - frontend_node_modules:/web/node_modules
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173"]
      interval: 2s
      timeout: 5s
      retries: 15

  api-tester:
    build:
      context: .
      dockerfile: tests/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      API_URL: http://app:8000
      TEST_CATEGORIES: ${API_TEST_CATEGORIES}
    volumes:
      - ./tests/api:/workspace/tests/api
      - ./database:/database:ro
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_healthy
      fake-oidc:
        condition: service_healthy
    profiles: ["test"]
    command: ["sh", "-c", "python /database/demo_data.py --replace && python tests/api/run_tests.py"]

  e2e-tester:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    environment:
      FRONTEND_URL: http://frontend:5173
    volumes:
      - ./tests/e2e/specs:/workspace/specs
      - ./tests/e2e/playwright.config.ts:/workspace/playwright.config.ts:ro
      - ./tests/e2e/playwright-report:/workspace/playwright-report
    depends_on:
      frontend:
        condition: service_healthy
    profiles: ["test"]

  e2e-report:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    ports:
      - "${PLAYWRIGHT_REPORT_PORT:-9323}:9323"
    volumes:
      - ./tests/e2e/playwright-report:/workspace/playwright-report:ro
    profiles: ["test"]
    command: ["npm", "run", "report"]

volumes:
  postgres_data:
  frontend_node_modules:
