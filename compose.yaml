services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: ./app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_local}@database:5432/${POSTGRES_DB:-crm}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ./web
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./web:/web
      - frontend_node_modules:/web/node_modules
    depends_on:
      app:
        condition: service_healthy

  tester:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_local}@database:5432/${POSTGRES_DB:-crm}
      API_URL: http://app:8000
    volumes:
      - ./tests:/workspace/tests
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres_data:
  frontend_node_modules:
