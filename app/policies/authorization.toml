# Volunteer CRM authorization policy
#
# This file says what signed-in people may do. It does not store who belongs to a
# group or family; those facts remain in PostgreSQL. Every rule reads as:
# "When this relationship is true, grant this action over this scope."
#
# Supported scopes:
#   all               every record of this kind
#   group_descendants the assigned group and every group below it
#   family            family units, or contacts in those family units
#   self              the signed-in person's own contact record

version = 1

[actions."contact:view"]
description = "View a person's CRM contact record."
resource = "contact"

[[actions."contact:view".rules]]
# System administrators can view every contact.
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[[actions."contact:view".rules]]
# Area Managers can view contacts with active roles in their area or a group below it.
source = "group_role"
relationship = "Area Manager"
scope = "group_descendants"

[[actions."contact:view".rules]]
# Group Leaders can view contacts with active roles in their group or a group below it.
source = "group_role"
relationship = "Group Leader"
scope = "group_descendants"

[[actions."contact:view".rules]]
# Also: family members of anyone with an active role in the Leader's exact
# group (not descendants) - necessary so the write extension of the same
# shape (contact:update) is actually usable via the GET-then-PATCH pattern.
source = "group_role"
relationship = "Group Leader"
scope = "group_and_family"

[[actions."contact:view".rules]]
# Parents can view every contact connected to one of their family units.
source = "family_relationship"
relationship = "Parent"
scope = "family"

[[actions."contact:view".rules]]
# Every signed-in person can view their own contact record, including children.
source = "self"
scope = "self"

[actions."contact:view-sensitive"]
description = "View a contact's sensitive data (emergency contacts, medical conditions) - separate from ordinary contact:view so, e.g., a Group Helper who can see a child's name doesn't automatically see this."
resource = "contact"

[[actions."contact:view-sensitive".rules]]
# Deliberately mirrors contact:view's entire rule set exactly (documents/
# contact-data-expansion-design.md "Sensitive-data read access") - kept as
# its own action so it can be tightened independently later without
# touching ordinary contact visibility.
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[[actions."contact:view-sensitive".rules]]
source = "group_role"
relationship = "Area Manager"
scope = "group_descendants"

[[actions."contact:view-sensitive".rules]]
source = "group_role"
relationship = "Group Leader"
scope = "group_descendants"

[[actions."contact:view-sensitive".rules]]
source = "group_role"
relationship = "Group Leader"
scope = "group_and_family"

[[actions."contact:view-sensitive".rules]]
source = "family_relationship"
relationship = "Parent"
scope = "family"

[[actions."contact:view-sensitive".rules]]
source = "self"
scope = "self"

[actions."contact-role:view"]
description = "View a person's organisational role and group assignments."
resource = "contact"

[[actions."contact-role:view".rules]]
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[[actions."contact-role:view".rules]]
source = "group_role"
relationship = "Area Manager"
scope = "group_descendants"

[[actions."contact-role:view".rules]]
source = "group_role"
relationship = "Group Leader"
scope = "group_descendants"

[[actions."contact-role:view".rules]]
source = "family_relationship"
relationship = "Parent"
scope = "family"

[[actions."contact-role:view".rules]]
source = "self"
scope = "self"

[actions."family:view"]
description = "View a family unit and the people connected to it."
resource = "family"

[[actions."family:view".rules]]
# System administrators can view every family.
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[[actions."family:view".rules]]
# Parents can view family units to which they are connected as a parent.
source = "family_relationship"
relationship = "Parent"
scope = "family"

[actions."family:manage-main-contact"]
description = "Change which family member currently holds Main Contact status."
resource = "family"

[[actions."family:manage-main-contact".rules]]
# Admin-only for now - see documents/api-contract.md "Main Contact tracking"
# for why this starts restrictive rather than open to Group Leaders too.
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[actions."group:view"]
description = "View an organisational group."
resource = "group"

[[actions."group:view".rules]]
# System administrators can view the entire organisational structure.
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[[actions."group:view".rules]]
# Managers can view their area and every group below it.
source = "group_role"
relationship = "Area Manager"
scope = "group_descendants"

[[actions."group:view".rules]]
# Leaders can view their group and every group below it.
source = "group_role"
relationship = "Group Leader"
scope = "group_descendants"

[actions."reference-data:view"]
description = "View shared role and group type definitions."
resource = "reference-data"

[[actions."reference-data:view".rules]]
# Reference definitions contain no personal records, so every signed-in user may see them.
source = "authenticated"
scope = "all"

[actions."invitation:create"]
description = "Invite an existing CRM contact to become an application user."
resource = "invitation"

[[actions."invitation:create".rules]]
# Inviting users is initially reserved for Global System Administrators.
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[actions."contact:create"]
description = "Create a CRM contact without granting login access."
resource = "contact"

[[actions."contact:create".rules]]
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[actions."contact:update"]
description = "Edit or archive an existing contact."
resource = "contact"

[[actions."contact:update".rules]]
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[[actions."contact:update".rules]]
# Full field access including archiving, scoped to the Group Leader's own
# exact group only - not descendants (documents/open-questions.md #4) -
# extended through contact_family_units to each group member's family too
# (documents/contact-data-expansion-design.md's write-access model).
source = "group_role"
relationship = "Group Leader"
scope = "group_and_family"

[actions."directory:view"]
description = "Browse the organisation-wide address book of adult volunteers."
resource = "directory-entry"

[[actions."directory:view".rules]]
# Anyone currently holding one of these organisational roles, in any group, can
# browse the whole directory - this is not scoped to their own branch.
source = "group_role"
relationship = "Group Leader"
scope = "all"

[[actions."directory:view".rules]]
source = "group_role"
relationship = "Group Helper"
scope = "all"

[[actions."directory:view".rules]]
source = "group_role"
relationship = "Area Manager"
scope = "all"

[[actions."directory:view".rules]]
# Reads the is_global flag rather than naming a specific access role, so any
# future global role is admitted automatically.
source = "access_role_flag"
relationship = "is_global"
scope = "all"

[actions."directory-visibility:manage-own"]
description = "Read and change your own address-book visibility settings."
resource = "directory-entry"

[[actions."directory-visibility:manage-own".rules]]
# Every authenticated contact manages their own visibility, whether or not
# they currently hold an eligible role.
source = "self"
scope = "self"

# --- Contact details (documents/contact-data-expansion-design.md) ----------
# Deliberately distinct from contact:update, which keeps its own narrower
# rules (Global System Administrator plus Group-Leader-exact-group). Reading
# reuses contact:view unchanged - already a superset of what these grant.

[actions."contact-personal:update"]
description = "Edit a contact's personal-details fields (date_of_birth, preferred_name, phonetic_name, pronouns, gender) via PATCH /contacts/{id}."
resource = "contact"

[[actions."contact-personal:update".rules]]
source = "access_role"
relationship = "Global System Administrator"
scope = "all"

[[actions."contact-personal:update".rules]]
source = "self"
scope = "self"

[[actions."contact-personal:update".rules]]
source = "main_contact_family"
scope = "family"

[[actions."contact-personal:update".rules]]
source = "group_role"
relationship = "Group Leader"
scope = "group_and_family"

