name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review with Claude
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true

          prompt: |
            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: ${{ github.event.pull_request.number }}

            Act only as a code reviewer. Do not modify files, create commits,
            push changes, merge the pull request, or approve it.

            Review the complete pull-request diff and relevant surrounding code.
            Report concrete, actionable problems rather than general advice.

            Pay particular attention to:

            1. Correctness
               - Logic errors and broken edge cases
               - Incorrect API behaviour
               - Error handling and failure states
               - Backwards compatibility

            2. CRM data integrity
               - Database constraints and relationships
               - SQL query correctness
               - Pagination and record-count accuracy
               - Consistency between schema.sql and the DBML model
               - Pydantic validation and API response contracts

            3. Security and privacy
               - Input validation
               - SQL injection risks
               - Authentication and authorization mistakes
               - Exposure of personal volunteer or member information
               - Secrets or credentials committed to the repository

            4. Frontend
               - React and TypeScript correctness
               - Loading, empty, and error states
               - Unsafe assumptions about API responses
               - Accessibility problems that materially affect users

            5. Testing
               - Missing tests for changed behaviour
               - Tests that do not genuinely verify their stated behaviour
               - Important regression and edge cases

            Classify findings as:
            - P0: critical
            - P1: should block merging
            - P2: important but may not block merging
            - P3: minor improvement

            Use inline comments for findings tied to exact changed lines.
            Use the main PR comment for the overall summary.

            Do not report personal style preferences, speculative concerns,
            or minor formatting issues. Check whether an apparent problem is
            handled elsewhere before reporting it.

            If there are no actionable findings, clearly say:
            "No actionable findings."

          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"