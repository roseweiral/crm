server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin proxy to the API, so the browser never sees a second site.
    # This keeps the SameSite=Lax session cookie working (authentication.py) and
    # matches web/src/services/api.ts's relative-URL fallback, which is what the
    # production build actually uses since VITE_API_URL is never set at image
    # build time. The upstream hostname "app" only needs to resolve at container
    # start, which the Compose health-check dependency chain already guarantees.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
